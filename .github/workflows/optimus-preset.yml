name: Optimus preset

# Runs whenever the PrimeOne Figma plugin pushes an export to feature/updates-from-figma:
# regenerates optimus/sgc-preset.ts on that branch, then opens a pull request into main.
on:
  push:
    branches: [feature/updates-from-figma]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# The plugin pushes two commits per export (theme, then design tokens); never run two generators at once.
concurrency:
  group: optimus-preset
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the file header names the last commit that touched theme/ts

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate preset
        run: |
          set -o pipefail
          npm run --silent build:optimus | tee report.txt
          {
            echo '### Figma → Optimus mapping report'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm report.txt

      - name: Commit if changed
        run: |
          git add optimus/sgc-preset.ts
          if git diff --cached --quiet; then
            echo "Preset unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Regenerate Optimus preset from Figma export ($(git log -1 --format=%h -- theme/ts))"
          # The plugin may have pushed its second commit in the meantime.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "${BASE}" ]; then
            echo "Running on ${BASE}; no pull request needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch origin "${BASE}"
          if [ "$(git rev-list --count "origin/${BASE}..HEAD")" -eq 0 ]; then
            echo "Nothing ahead of ${BASE}; no pull request needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr list --head "${GITHUB_REF_NAME}" --base "${BASE}" --state open --json url --jq '.[0].url')
          if [ -n "${url}" ]; then
            echo "Pull request already open: ${url}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr create --head "${GITHUB_REF_NAME}" --base "${BASE}" \
            --title "Updates from Figma - $(date +%d.%m.%Y)" \
            --body "Automated Figma export (theme and design tokens) with the regenerated Optimus preset.")
          echo "Opened pull request: ${url}" >> "$GITHUB_STEP_SUMMARY"
