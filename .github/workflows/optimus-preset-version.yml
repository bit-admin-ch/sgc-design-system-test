name: Optimus preset version

# On every merge into main:
# 1. If optimus/sgc-preset.ts changed, snapshots it as optimus/sgc-preset-v<N>.ts with the next
#    running number. sgc-preset.ts stays the latest.
#    The same commit sets the package version to <N>.0.0.
# 2. Tags that commit v<N>, so the preset can be installed straight from Git:
#    npm install github:bit-admin-ch/sgc-design-system-test#v<N>
# 3. Resets feature/updates-from-figma to main, so the Figma branch does not lag behind
#    (rebase/squash merges rewrite its commits, and the version commit only exists on main).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession must not claim the same number.
concurrency:
  group: optimus-preset-version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the sync step needs the merge base with the Figma branch

      - name: Snapshot preset
        id: snapshot
        run: |
          # Another run may have pushed a version since this one was queued.
          git pull --ff-only origin "${GITHUB_REF_NAME}"

          latest=0
          for f in optimus/sgc-preset-v*.ts; do
            [ -e "$f" ] || continue
            n=${f#optimus/sgc-preset-v}
            n=${n%.ts}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            [ "$n" -gt "$latest" ] && latest=$n
          done

          if [ "$latest" -gt 0 ] && cmp -s optimus/sgc-preset.ts "optimus/sgc-preset-v${latest}.ts"; then
            echo "Preset identical to sgc-preset-v${latest}.ts; no new version." >> "$GITHUB_STEP_SUMMARY"
            echo "version=${latest}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next=$((latest + 1))
          cp optimus/sgc-preset.ts "optimus/sgc-preset-v${next}.ts"
          # Keeps package.json and package-lock.json in step with the tag created below.
          npm version "${next}.0.0" --no-git-tag-version --allow-same-version

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "optimus/sgc-preset-v${next}.ts" package.json package-lock.json
          git commit -m "Add Optimus preset version v${next}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Created optimus/sgc-preset-v${next}.ts" >> "$GITHUB_STEP_SUMMARY"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Tag version
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "Tag ${tag} already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The tag is what consumers install, so the package entry point must match the preset.
          if ! cmp -s optimus/sgc-preset.ts optimus/dist/sgc-preset.js; then
            echo "::error::optimus/dist/sgc-preset.js is out of date; run npm run build:optimus and commit optimus/dist."
            exit 1
          fi
          git tag "${tag}"
          git push origin "refs/tags/${tag}"
          echo "Tagged ${tag}: \`npm install github:${GITHUB_REPOSITORY}#${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync Figma branch with main
        env:
          FIGMA_BRANCH: feature/updates-from-figma
        run: |
          if ! git fetch origin "+refs/heads/${FIGMA_BRANCH}:refs/remotes/origin/${FIGMA_BRANCH}"; then
            echo "${FIGMA_BRANCH} does not exist; nothing to sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          main_sha=$(git rev-parse HEAD)
          figma_sha=$(git rev-parse "origin/${FIGMA_BRANCH}")
          if [ "$main_sha" = "$figma_sha" ]; then
            echo "${FIGMA_BRANCH} already matches main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only reset when the branch holds nothing main lacks: merging it into main must be a no-op.
          # Otherwise Figma has pushed a new export that is still waiting for its pull request.
          if ! merged=$(git merge-tree --write-tree HEAD "origin/${FIGMA_BRANCH}") \
            || [ "$merged" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "${FIGMA_BRANCH} has changes that are not in main yet; left untouched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The lease aborts the push if Figma pushed in the meantime.
          git push origin "HEAD:refs/heads/${FIGMA_BRANCH}" \
            --force-with-lease="refs/heads/${FIGMA_BRANCH}:${figma_sha}"
          echo "Reset ${FIGMA_BRANCH} to main (${main_sha::7})." >> "$GITHUB_STEP_SUMMARY"
